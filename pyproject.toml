[project]
name = "got-agents"
version = "0.1.0"
description = "Storyboard — generative political agents for Westeros"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "openai>=2.41.0",
    "weave>=0.52.42",
    "redisvl>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
backend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/got_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

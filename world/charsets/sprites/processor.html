async function processAll() {
  const entries = Object.entries(images);
  let done = 0;
  const promises = entries.map(([fname, b64]) => {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], {type:'image/png'});
    const fd = new FormData();
    fd.append('image_file', new File([blob], fname, {type:'image/png'}));
    fd.append('size', 'preview');
    return fetch('https://api.remove.bg/v1.0/removebg', {
      method:'POST', headers:{'X-Api-Key':API_KEY}, body:fd
    }).then(r => r.ok
      ? r.blob().then(b => new Promise(res => {
          const fr = new FileReader();
          fr.onloadend = () => { window._rbgResults[fname] = fr.result.split(',')[1]; done++; document.getElementById('status').textContent = done+'/'+entries.length; res(); };
          fr.readAsDataURL(b);
        }))
      : r.text().then(t => { window._rbgErrors[fname]='ERR:'+r.status+':'+t.slice(0,80); done++; document.getElementById('status').textContent = done+'/'+entries.length; })
    ).catch(e => { window._rbgErrors[fname]='EXC:'+e.message; done++; });
  });
  await Promise.all(promises);
  window._rbgDone = true;
  document.getElementById('status').textContent = 'DONE';
}

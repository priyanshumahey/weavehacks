# AOF + RDB persistence so Redis is both hot path and durable record.

bind 0.0.0.0
protected-mode no
port 6379

appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
dir /data

save 900 1
save 300 10
save 60 10000
rdbcompression yes
dbfilename dump.rdb

maxmemory-policy noeviction
loglevel notice
